services:
  caleon:
    # built for linux/amd64 and linux/arm64 on every push to main; use a vX.Y.Z tag to pin a release
    image: ghcr.io/danibram/caleon:latest
    # to build from this checkout instead, uncomment and run `docker compose up -d --build`
    # build: .
    container_name: caleon
    restart: unless-stopped
    # host network lets the server find the thermostat by UDP broadcast. With CALEON_HOST set,
    # a normal bridge network with "ports: [8088:8088]" also works.
    network_mode: host
    environment:
      BIND: "0.0.0.0:8088"
      TZ: "Europe/Madrid"                 # your time zone, for the timestamps in the server log
      # CALEON_HOST: "192.168.1.50"        # fixed IP instead of broadcast discovery
      # TRANSPORT: "udp"                   # initial mode (udp/session/sdk); later changed in Ajustes
      # CALEON_EMAIL: "tu-correo@ejemplo.com"  # only for the "session" mode
      # POLL_SECONDS: "60"
      # BACKUP_HOURS: "24"
      # BACKUP_KEEP: "30"
      # PROMETHEUS: "1"                   # /metrics for Prometheus; "0" turns it off
    volumes:
      - ./data:/data
