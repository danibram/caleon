<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>°CALEON</title>
<link rel="icon" href="/icons/caleon_logo.svg">
<style>
:root {
  /* warm, domestic palette: neutrals tinted toward the Caleon orange, in OKLCH */
  --bg: oklch(0.973 0.007 70); --card: oklch(0.995 0.004 75); --ink: oklch(0.27 0.014 55);
  --muted: oklch(0.55 0.018 58); --line: oklch(0.905 0.01 68); --soft: oklch(0.955 0.011 70);
  --accent: oklch(0.66 0.2 42); --accent-soft: oklch(0.93 0.05 55); --accent-ink: oklch(0.42 0.14 42);
  --on-accent: oklch(0.99 0.01 80); --eco: oklch(0.74 0.07 160); --turbo: oklch(0.58 0.13 38);
  --off: oklch(0.5 0.012 65); --cool: oklch(0.6 0.13 248);
  --normal: oklch(0.85 0.085 80); --on-normal: oklch(0.32 0.05 72); --normal-ink: oklch(0.47 0.08 72);
  --slot-off: oklch(0.92 0.008 70); --slot-eco: var(--eco); --slot-normal: var(--normal); --slot-turbo: var(--turbo);
  --warn-bg: oklch(0.95 0.05 75); --warn-ink: oklch(0.47 0.12 55);
  --shadow: 0 1px 2px oklch(0.5 0.03 60 / 0.05), 0 4px 16px oklch(0.5 0.03 60 / 0.06);
  --shadow-sm: 0 1px 2px oklch(0.5 0.03 60 / 0.06);
  --radius: 18px;
  --series: oklch(0.55 0.09 235), oklch(0.56 0.12 350), oklch(0.6 0.1 135), oklch(0.66 0.11 75),
            oklch(0.6 0.16 345), oklch(0.6 0.1 120), oklch(0.55 0.05 260), oklch(0.6 0.02 60);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.195 0.01 65); --card: oklch(0.255 0.013 62); --ink: oklch(0.93 0.012 72);
    --muted: oklch(0.68 0.016 64); --line: oklch(0.33 0.014 62); --soft: oklch(0.305 0.014 62);
    --accent: oklch(0.7 0.19 45); --accent-soft: oklch(0.36 0.08 48); --accent-ink: oklch(0.82 0.13 52);
    --off: oklch(0.48 0.012 64); --normal-ink: oklch(0.86 0.12 80);
    --soft: oklch(0.335 0.015 62);
    --eco: oklch(0.66 0.07 160); --turbo: oklch(0.6 0.12 38); --normal: oklch(0.73 0.085 72);
    --slot-off: oklch(0.38 0.012 62); --slot-eco: oklch(0.6 0.065 160); --slot-normal: oklch(0.68 0.08 72); --slot-turbo: oklch(0.56 0.12 38); --warn-bg: oklch(0.34 0.07 65); --warn-ink: oklch(0.85 0.09 70);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 6px 20px oklch(0 0 0 / 0.28); --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  }
}
:root[data-theme="dark"] {
    --bg: oklch(0.195 0.01 65); --card: oklch(0.255 0.013 62); --ink: oklch(0.93 0.012 72);
    --muted: oklch(0.68 0.016 64); --line: oklch(0.33 0.014 62); --soft: oklch(0.305 0.014 62);
    --accent: oklch(0.7 0.19 45); --accent-soft: oklch(0.36 0.08 48); --accent-ink: oklch(0.82 0.13 52);
    --off: oklch(0.48 0.012 64); --normal-ink: oklch(0.86 0.12 80);
    --soft: oklch(0.335 0.015 62);
    --eco: oklch(0.66 0.07 160); --turbo: oklch(0.6 0.12 38); --normal: oklch(0.73 0.085 72);
    --slot-off: oklch(0.38 0.012 62); --slot-eco: oklch(0.6 0.065 160); --slot-normal: oklch(0.68 0.08 72); --slot-turbo: oklch(0.56 0.12 38); --warn-bg: oklch(0.34 0.07 65); --warn-ink: oklch(0.85 0.09 70);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 6px 20px oklch(0 0 0 / 0.28); --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  }
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
a { color: inherit; }
::selection { background: var(--accent-soft); }
html { scrollbar-gutter: stable; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1150px; margin: 0 auto; padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; font-weight: 650; }
h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 12px; text-align: right; line-height: 1.35; display: flex; align-items: center; gap: 7px; }
.brand { text-decoration: none; }
.live { width: 8px; height: 8px; border-radius: 50%; background: oklch(0.7 0.16 150); box-shadow: 0 0 0 3px color-mix(in oklch, oklch(0.7 0.16 150) 22%, var(--bg)); flex: none; }
.live.stale { background: oklch(0.75 0.14 75); box-shadow: none; }
.live.err { background: var(--turbo); box-shadow: 0 0 0 3px color-mix(in oklch, var(--turbo) 22%, var(--bg)); }
@media (max-width: 680px) { .meta .long { display: none; } }
#nav { max-width: 1150px; margin: 0 auto; padding: 4px 14px 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#nav::-webkit-scrollbar { display: none; }
#nav a { padding: 10px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; font-weight: 500; transition: color .2s; display: flex; align-items: center; gap: 7px; }
#nav a svg { width: 18px; height: 18px; }
#nav a .nav-label { display: inline; }
#nav a:hover { color: var(--ink); }
#nav a.active { color: var(--ink); border-color: var(--ink); }
main { max-width: 1150px; margin: 0 auto; padding: 20px 20px 48px; }
h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h3 { font-size: 23px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.back:hover { color: var(--accent); }
.banner { background: var(--warn-bg); color: var(--warn-ink); padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
/* bottom tab bar on phones */
.tabbar { display: none; }
@media (max-width: 680px) {
  #nav { display: none; }
  main { padding: 16px 16px 92px; }
  .bar { padding: 12px 16px; }
  .tabbar { display: grid; position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    grid-auto-flow: column; grid-auto-columns: 1fr; background: color-mix(in oklch, var(--card) 90%, transparent);
    backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0; text-decoration: none;
    color: var(--muted); font-size: 11px; font-weight: 600; transition: color .15s; }
  .tabbar a svg { width: 23px; height: 23px; }
  .tabbar a.active { color: var(--ink); }
  .tabbar a.active span { font-weight: 700; }
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.card + .card, .section { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.room-icon { width: 36px; height: 36px; flex: none; }
.room-title { font-weight: 600; font-size: 16px; text-decoration: none; letter-spacing: -0.01em; }
.badge { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; letter-spacing: 0.01em; }
.badge.regular { background: color-mix(in oklch, var(--normal) 24%, var(--card)); color: var(--normal-ink); }
.badge.turbo { background: color-mix(in oklch, var(--turbo) 18%, var(--card)); color: var(--turbo); }
.badge.eco { background: color-mix(in oklch, var(--eco) 18%, var(--card)); color: var(--eco); }
.badge.holiday { background: color-mix(in oklch, var(--cool) 18%, var(--card)); color: var(--cool); }
.badge.heat { background: var(--accent); color: var(--on-accent); }
.room-card { cursor: pointer; transition: box-shadow .25s, transform .25s cubic-bezier(.22,1,.36,1), border-color .25s; }
@media (hover: hover) { .room-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: color-mix(in oklch, var(--accent) 35%, var(--line)); } }
.room-card.heating { border-color: color-mix(in oklch, var(--accent) 45%, var(--line)); }
.temp { font-size: 46px; font-weight: 280; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; line-height: 1.05; margin-top: 10px; }
.temp small { font-size: 18px; color: var(--muted); margin-left: 2px; font-weight: 400; }
.setpoint { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 14px; padding: 6px; border-radius: 14px; background: var(--soft); }
.setpoint .value { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: -0.01em; }
.setpoint .label { font-size: 11px; color: var(--muted); text-align: center; letter-spacing: 0.02em; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: transform .12s cubic-bezier(.22,1,.36,1), border-color .15s, color .15s; -webkit-tap-highlight-color: transparent; }
.round:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.round:active:not(:disabled) { transform: scale(0.9); }
button { font: inherit; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .4; cursor: default; }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: var(--soft); padding: 4px; border-radius: 13px; }
.modes button { border: 0; background: transparent; color: var(--muted); border-radius: 10px; padding: 9px 0; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
.modes button:hover:not(:disabled):not(.active) { color: var(--ink); }
.modes button.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow-sm); }
.modes button.active[data-mode="eco"] { color: var(--eco); }
.modes button.active[data-mode="turbo"] { color: var(--turbo); }
.modes button.active[data-mode="off"] { color: var(--off); }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 11px; padding: 9px 14px; font-size: 13.5px; font-weight: 550; cursor: pointer; box-shadow: var(--shadow-sm); transition: border-color .15s, background .15s, transform .1s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--turbo); }
/* radial setpoint gauge on the room page */
.gauge { position: relative; width: min(280px, 72vw); aspect-ratio: 1; margin: 6px auto 2px; }
.gauge svg { width: 100%; height: 100%; transform: rotate(0deg); }
.gauge .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.gauge .g-temp { font-size: 54px; font-weight: 280; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.gauge .g-temp small { font-size: 22px; color: var(--muted); }
.gauge .g-set { margin-top: 6px; font-size: 13px; color: var(--muted); font-weight: 550; }
.gauge .g-set b { color: var(--accent); font-variant-numeric: tabular-nums; }
.dial-controls { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 10px 0 2px; }
.dial-controls .round { width: 58px; height: 58px; font-size: 30px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
.tile { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 14px 8px; text-align: center; cursor: pointer; color: var(--ink); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); transition: border-color .18s, transform .18s cubic-bezier(.22,1,.36,1), box-shadow .18s; }
.tile img { width: 42px; height: 42px; }
.tile:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.tile.hl { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.tile.disabled { opacity: .45; cursor: default; pointer-events: none; }
/* room action rows: clearer than a square-tile grid */
.actrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.actrow a, .actrow button { display: flex; align-items: center; gap: 11px; text-align: left; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); border-radius: 13px; padding: 11px 13px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: 550;
  box-shadow: var(--shadow-sm); transition: border-color .15s, transform .12s, background .15s; }
.actrow a:hover, .actrow button:hover { border-color: var(--accent); }
.actrow a:active, .actrow button:active { transform: scale(0.98); }
.actrow .ic { width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; }
.actrow .ic img { width: 22px; height: 22px; }
.list { display: flex; flex-direction: column; }
.list button { text-align: left; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); padding: 14px 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; transition: color .12s; }
.list button:first-child { border-top: 0; }
@media (hover: hover) { .list button:hover:not(:disabled) { color: var(--accent); } }
.big-value { font-size: 44px; font-weight: 300; text-align: center; margin: 14px 0; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.lines p { margin: 3px 0; font-variant-numeric: tabular-nums; }
.lines p.center { text-align: center; }
.lines p.link { color: var(--accent); cursor: pointer; }
input, select { font: inherit; padding: 10px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); transition: border-color .15s; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; text-align: left; }
th { color: var(--muted); font-weight: 600; border-top: 0; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.chart { width: 100%; height: 260px; display: block; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .gl { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend label { cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: background .18s, color .18s; }
.seg button:hover:not(.active) { color: var(--ink); }
.seg button.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.week { display: grid; grid-template-columns: 74px repeat(48, minmax(0, 1fr)); gap: 1px; user-select: none; touch-action: none; }
.week .d { font-size: 12px; color: var(--muted); display: flex; align-items: center; cursor: pointer; }
.week .d.dirty { color: var(--accent); font-weight: 600; }
.week .s { height: 30px; border-radius: 2px; cursor: crosshair; }
.week .h { font-size: 10px; color: var(--muted); grid-column: span 4; }
.slot-off, .sw.slot-off { background: var(--slot-off) repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in oklch, var(--ink) 9%, transparent) 5px 6px); }
.slot-regular { background: var(--slot-normal); }
.slot-eco { background: var(--slot-eco); }
.slot-turbo { background: var(--slot-turbo); }
.slot-on, .slot-hws_on { background: var(--accent); }
.slot-hws_off { background: var(--slot-off); }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; border: 1px solid var(--line); }
.palette button.active { box-shadow: 0 0 0 2px var(--ink); }
.pill { display: inline-block; min-width: 36px; text-align: center; padding: 2px 8px; border-radius: 7px; font-size: 12px; font-weight: 600; background: var(--soft); color: var(--muted); }
.pill.on { background: var(--accent); color: var(--on-accent); }
.metric-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv:first-of-type { border-top: 0; }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
.no-vt .view-enter { animation: fade .3s cubic-bezier(.22,1,.36,1); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 20px; width: min(380px, 92vw); box-shadow: var(--shadow); }
dialog::backdrop { background: oklch(0.2 0.02 60 / 0.4); backdrop-filter: blur(2px); }
dialog input { width: 100%; margin: 10px 0 16px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 550; z-index: 30; width: max-content; max-width: min(520px, calc(100vw - 32px)); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; box-shadow: var(--shadow); animation: fade .25s; }
@media (max-width: 680px) { .toast { bottom: 84px; } }
@media (max-width: 640px) {
  .week { grid-template-columns: 40px repeat(48, minmax(0, 1fr)); }
  .week .s { height: 26px; }
  .temp { font-size: 42px; }
  .card { padding: 16px; }
}

/* ---- icons */
svg.mini { width: 14px; height: 14px; vertical-align: -2px; }
svg.heat, .heat svg { color: var(--accent); }
.badge svg.mini { width: 12px; height: 12px; margin-right: 3px; vertical-align: -1.5px; }
.badges { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
/* ---- home summary */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding: 6px 2px 22px; }
.hero-kicker { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 550; color: var(--ink); }
.hero-ic { width: 17px; height: 17px; }
.hero-temp { font-size: 76px; font-weight: 250; letter-spacing: -0.05em; line-height: 0.95; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
.hero-temp small { font-size: 28px; color: var(--muted); font-weight: 350; margin-left: 2px; letter-spacing: 0; }
.hero-sub { color: var(--muted); font-size: 13.5px; }
.hero-facts { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-facts div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 92px; font-size: 12px; color: var(--muted); box-shadow: var(--shadow-sm); }
.hero-facts span { display: block; font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.section-head { margin: 4px 0 10px; }
.section-head h2 { margin: 0; }
.link-more { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: none; }
/* ---- room cards */
.room-card .room-title { font-size: 16.5px; }
.room-reading { display: flex; align-items: baseline; gap: 12px; }
.room-reading .hum { display: inline-flex; align-items: center; gap: 4px; }
.room-card.is-off .temp { color: var(--muted); }
.room-card.heating { background: linear-gradient(180deg, color-mix(in oklch, var(--accent) 7%, var(--card)), var(--card) 60%); }

/* ================= motion ================= */
:root { --ease: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1); }
header { view-transition-name: header; }
.tabbar { view-transition-name: tabbar; }
::view-transition-old(root) { animation: 200ms var(--ease) both vt-out; }
::view-transition-new(root) { animation: 360ms var(--ease) both vt-in; }
[data-nav="back"]::view-transition-old(root) { animation-name: vt-out-back; }
[data-nav="back"]::view-transition-new(root) { animation-name: vt-in-back; }
[data-nav="same"]::view-transition-old(root) { animation-name: vt-fade-out; }
[data-nav="same"]::view-transition-new(root) { animation-name: vt-fade-in; }
::view-transition-group(*) { animation-duration: 420ms; animation-timing-function: var(--ease); }
::view-transition-old(header), ::view-transition-new(header), ::view-transition-old(tabbar), ::view-transition-new(tabbar) { animation: none; }
@keyframes vt-out { to { opacity: 0; transform: translateX(-28px); } }
@keyframes vt-in { from { opacity: 0; transform: translateX(36px); } }
@keyframes vt-out-back { to { opacity: 0; transform: translateX(28px); } }
@keyframes vt-in-back { from { opacity: 0; transform: translateX(-36px); } }
@keyframes vt-fade-out { to { opacity: 0; transform: translateY(-6px); } }
@keyframes vt-fade-in { from { opacity: 0; transform: translateY(8px); } }
/* staggered entrance, only right after navigating (class removed afterwards) */
.view-enter .stagger > * { animation: rise .55s var(--ease) both; animation-delay: calc(var(--k, 0) * 45ms + 60ms); }
.view-enter .hero { animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.985); } }
/* gauge: arc and markers move with transforms / dash offset */
.gauge .g-fill { transition: stroke-dashoffset .7s var(--ease), stroke .3s; }
.gauge .g-rot { transform-origin: 100px 100px; transition: transform .7s var(--ease); }
.view-enter .gauge .g-track { animation: track-in .7s var(--ease) both; }
@keyframes track-in { from { opacity: 0; } }
.tick-up { animation: tick-up .45s var(--ease); }
.tick-down { animation: tick-down .45s var(--ease); }
@keyframes tick-up { from { opacity: 0; transform: translateY(10px); } }
@keyframes tick-down { from { opacity: 0; transform: translateY(-10px); } }
/* sliding indicator for the mode selector */
.modes { position: relative; }
.mode-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px - 15px) / 4); border-radius: 10px; background: var(--card); box-shadow: var(--shadow-sm); transform: translateX(calc(var(--i, 0) * (100% + 5px))); transition: transform .45s var(--ease); pointer-events: none; }
.modes button { position: relative; z-index: 1; }
.modes button.active { background: transparent; box-shadow: none; }
.modes.no-active .mode-ind { opacity: 0; }
/* life */
.live { position: relative; }
.live:not(.stale):not(.err)::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: oklch(0.7 0.16 150); animation: ping 2.4s var(--ease) infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .6; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
.badge.heat svg, .gauge.heating .g-cap svg, .hero-ic.heat { animation: breathe 2.6s var(--ease-io) infinite; transform-origin: 50% 80%; }
@keyframes breathe { 50% { transform: scale(1.18); opacity: .8; } }
.tabbar a svg { transition: transform .3s var(--ease); }
.tabbar a.active svg { transform: translateY(-1px) scale(1.08); }
.tabbar a:active svg { transform: scale(.9); }
.room-card:active { transform: scale(.985); transition-duration: .1s; }
.actrow a .chev, .actrow button .chev { transition: transform .25s var(--ease); }
.actrow a:hover .chev, .actrow button:hover .chev { transform: translateX(3px); }
.toast { animation: toast-in .45s var(--ease); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } to { transform: translate(-50%, 0); } }
/* skeletons instead of spinners */
.skel { border-radius: var(--radius); background: linear-gradient(100deg, var(--soft) 30%, color-mix(in oklch, var(--soft) 55%, var(--card)) 50%, var(--soft) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }
.skel-stack { display: grid; gap: 14px; }
/* chart lines draw in once */
.view-enter .chart path.line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) .15s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; transition: none !important; }
}

/* dialog: centered on desktop, bottom sheet on phones */
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: -6px 0 16px; }

}

/* stronger, bigger mode selector */

    </div>`;
  const idx = MODES.findIndex(([k]) => k === mode);
  return `${sp}<div class="modes ${idx < 0 ? "no-active" : ""}" role="group" aria-label="Modo" data-mid="${r.id}" data-i="${idx}" data-am="${idx < 0 ? "" : mode}"><span class="mode-ind" style="transform:translateX(calc(${Math.max(idx, 0)} * (100% + 5px)))"></span>${MODES.map(([k, label]) =>
    `<button data-act="mode" data-v="${k}" data-mode="${k}" class="${k === mode ? "active" : ""}" aria-pressed="${k === mode}" ${r.vacation ? "disabled" : ""}>${label}${r.id != SYSTEM ? `<small>${k === "off" ? "&nbsp;" : modeTemp(r, k) !== null ? fmtC(modeTemp(r, k)) + "°" : "–°"}</small>` : ""}</button>`).join("")}</div>`;
}

async function roomChange(id, body, rerender) {
  // the answer can arrive after the user has left the page: then the new page redraws itself
  const seq = navSeq, redraw = () => { if (seq === navSeq) rerender(); };
  const room = roomById(id), before = room && {mode: room.mode, tset: room.tset};
  if (room && body.mode) room.mode = body.mode;
  if (room && body.tdelta) { const t = num(room.tset); if (t !== null) room.tset = (t + 0.5 * body.tdelta).toFixed(1) + "°C"; }
  if (id == SYSTEM && body.mode && S.system) S.system.mode = body.mode;
  roomBusy.add(Number(id)); redraw();
  try {
    const st = await api(`/api/rooms/${id}`, {body, any: true});
    if (st.state) { S = st.state; paintMeta(); delete st.state; }
    if (id == SYSTEM) S.system = st; else Object.assign(roomById(id), st);
    rereadSoon();
    if (navigator.vibrate) navigator.vibrate(8);
  } catch (e) {
    if (room && before) Object.assign(room, before);
    toast("No se pudo aplicar: " + e.message, 6000);
  }
  roomBusy.delete(Number(id));
  if (seq !== navSeq) { refreshView(); return; }
  rerender();
  if (id == SYSTEM) refreshView();
}

// #view outlives every page: install its listeners once and point them at the current page
let roomRerender = null, roomControlsBound = false;
function bindRoomControls(container, rerender) {
  roomRerender = rerender;
  if (roomControlsBound) return;
  roomControlsBound = true;
  container.addEventListener("keydown", ev => {
    const card = ev.target.closest("[data-href]");
    if (card && ev.target === card && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); location.hash = card.dataset.href; }
  });
  container.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b) {
      const card = ev.target.closest("[data-href]");
      if (card && !ev.target.closest("button, a, .modes, .setpoint")) location.hash = card.dataset.href;
      return;
    }
    if (b.disabled) return;
    if ($("#view").classList.contains("stale-data")) { toast("No se aplicó · el termostato no responde ahora mismo"); return; }
    const id = b.closest("[data-room]").dataset.room;
    if (roomBusy.has(Number(id))) return;
    const act = b.dataset.act;
    if (act === "tdelta") { ev.preventDefault(); roomChange(id, {tdelta: Number(b.dataset.v)}, roomRerender); }
    else if (act === "mode") { ev.preventDefault(); roomChange(id, {mode: b.dataset.v}, roomRerender); }
  });
}

// ---------- overview

const todayIdx = () => (new Date().getDay() + 6) % 7;
const nowSlotIdx = () => { const d = new Date(); return d.getHours() * 2 + (d.getMinutes() >= 30 ? 1 : 0); };
function nextChange(r) {
  if (!r.week) return null;
  const today = todayIdx(), ns = nowSlotIdx(), cur = r.week[today][ns];
  for (let k = 1; k <= 48 * 7; k++) {
    const abs = today * 48 + ns + k, d = Math.floor(abs / 48) % 7, i = abs % 48, m = r.week[d][i];
    if (m !== cur) return {mode: m, slot: i, dayOffset: Math.floor((today * 48 + ns + k) / 48) - today, now: cur};
  }
  return {now: cur};
}
function band(r, {big = false} = {}) {
  if (!r.week) return "";
  const slots = r.week[todayIdx()], ns = nowSlotIdx(), nc = nextChange(r), paused = modeOf(r) === "off" || !!r.vacation;
  const when = nc && nc.mode ? `${nc.dayOffset === 0 ? "a las" : nc.dayOffset === 1 ? "mañana a las" : DAYS[(todayIdx() + nc.dayOffset) % 7].toLowerCase() + " a las"} ${hhmm(nc.slot)}` : "";
  const next = nc && nc.mode ? `${MODE_LABEL[nc.mode] || nc.mode} ${when}` : "";
  const caption = paused ? (r.vacation ? "Programa detenido durante las vacaciones" : big ? "Programa de hoy, detenido mientras esté apagada" : "Programa detenido")
    : next ? `Ahora ${(MODE_LABEL[nc.now] || "").toLowerCase()} · ${next}` : `${MODE_LABEL[nc?.now] || ""} todo el día`;
  return `<div class="band ${paused ? "paused" : ""} ${big ? "big" : ""}">
    <div class="band-bar" role="img" aria-label="Programa de hoy">${segments(slots).map(g => `<i class="slot-${g.mode}" style="flex:${g.end - g.start}"></i>`).join("")}<b class="needle" style="left:${(ns + 0.5) / 48 * 100}%"></b></div>
    ${big ? `<div class="band-axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>24 h</span></div>
      <div class="band-legend">${[...new Set(slots)].map(m => `<span><i class="sw slot-${m}"></i>${esc(modeWithTemp(r, m))}</span>`).join("")}</div>` : ""}
    <div class="band-cap">${icon("clock", "mini")}<span>${esc(caption)}</span></div>
  </div>`;
}

let histCache = {at: 0, data: null};
async function history6h() {
  if (Date.now() - histCache.at < 60000 && histCache.data) return histCache.data;
  try { histCache = {at: Date.now(), data: await api("/api/history?hours=6")}; } catch (e) {}
  return histCache.data;
}
/** "Todo apagado desde las 23:07", trend in °C/h over the last two hours. */
function insights(hist) {
  const out = {};
  if (!hist) return out;
  const rooms = S.rooms.filter(r => r.type !== "outdoor");
  if (rooms.every(r => modeOf(r) === "off")) {
    let since = 0;
    for (const r of rooms) {
      const rows = hist[String(r.id)] || [];
      for (let i = rows.length - 1; i > 0; i--) if (rows[i][4] === "off" && rows[i - 1][4] !== "off") { since = Math.max(since, rows[i][0]); break; }
    }
    if (since) out.offSince = since;
  }
  const avgAt = ts => { const v = rooms.map(r => (hist[String(r.id)] || []).find(x => x[0] >= ts)).filter(Boolean).map(x => x[1]).filter(x => x !== null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const now = Date.now() / 1000, a = avgAt(now - 7200), b = avgAt(now - 300);
  const first = Math.min(...rooms.map(r => (hist[String(r.id)] || [[now]])[0][0]));
  if (a !== null && b !== null && now - first > 3000) out.trend = (b - a) / Math.min(2, (now - Math.max(first, now - 7200)) / 3600);
  return out;
}

function homeSummary() {
  const rooms = S.rooms.filter(r => r.type !== "outdoor");
  const temps = rooms.map(r => num(r.temperature)).filter(v => v !== null);
  const avg = temps.length ? temps.reduce((a, b) => a + b, 0) / temps.length : null;
  const heating = rooms.filter(isHeating);
  const off = rooms.filter(r => modeOf(r) === "off");
  const hum = rooms.map(r => num(r.humidity)).filter(v => v !== null);
  const outdoor = (S.status || []).find(m => m.label === "Exterior");
  const ins = insights(histCache.data);
  const fmtClock = ts => new Date(ts * 1000).toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
  let line;
  if (heating.length) line = `Calentando ${heating.map(r => esc(roomTitle(r))).join(" y ")}`;
  else if (off.length === rooms.length) line = ins.offSince ? `Todo apagado desde las ${fmtClock(ins.offSince)}` : "Calefacción apagada en toda la casa";
  else line = "Todas las habitaciones en su temperatura";
  const trend = ins.trend === undefined ? "" : Math.abs(ins.trend) < 0.05 ? " · estable" : ` · ${ins.trend > 0 ? "sube" : "baja"} ${fmtC(Math.abs(ins.trend))} °C/h`;
  const upcoming = rooms.filter(r => modeOf(r) !== "off" && !r.vacation).map(r => ({r, nc: nextChange(r)})).filter(x => x.nc && x.nc.mode && x.nc.dayOffset === 0).sort((a, b) => a.nc.slot - b.nc.slot)[0];
  return `<section class="hero">
    <div class="hero-main">
      <div class="hero-kicker">${heating.length ? icon("flame", "hero-ic heat") : ""}${line}</div>
      <div class="hero-temp">${fmtC(avg)}<small>°</small></div>
      <div class="hero-sub">media de la casa${temps.length > 1 ? ` · de ${fmtC(Math.min(...temps))} a ${fmtC(Math.max(...temps))} °C` : ""}${trend}</div>
    </div>
    <div class="hero-facts">
      ${hum.length ? `<div><span>${Math.round(hum.reduce((a, b) => a + b, 0) / hum.length)} %</span>humedad</div>` : ""}
      ${outdoor && outdoor.value !== null ? `<div><span>${fmtC(outdoor.value)}°</span>fuera</div>` : ""}
      ${upcoming ? `<div><span>${hhmm(upcoming.nc.slot)}</span>${esc(roomTitle(upcoming.r))} a ${esc((MODE_LABEL[upcoming.nc.mode] || "").toLowerCase())}</div>` :
        `<div><span>${rooms.length - off.length}/${rooms.length}</span>encendidas</div>`}
    </div>
  </section>`;
}

function gauge(r) {
  const MIN = 5, MAX = 30, START = 135, SWEEP = 270, R = 84;
  const mode = modeOf(r), t = num(r.temperature), sp = num(r.tset), off = mode === "off" || sp === null;
  const frac = v => (Math.min(MAX, Math.max(MIN, v)) - MIN) / (MAX - MIN);
  const pt = (a, rad = R) => [100 + rad * Math.cos(a * Math.PI / 180), 100 + rad * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = pt(START), [x1, y1] = pt(START + SWEEP);
  const full = `M${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 1 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  const color = {turbo: "var(--turbo)", eco: "var(--eco)", regular: "var(--normal)"}[mode] || "var(--accent)";
  const ticks = [10, 15, 20, 25].map(v => { const a = START + frac(v) * SWEEP, [ax, ay] = pt(a, R - 13), [bx, by] = pt(a, R - 18); return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>`; }).join("");
  const pct = off ? 0 : Math.round(frac(sp) * 1000) / 10;
  const sA = off ? 0 : frac(sp) * SWEEP, tA = t === null ? 0 : frac(t) * SWEEP;
  return `<div class="gauge ${off ? "off" : ""} ${isHeating(r) ? "heating" : ""}" data-pct="${pct}" data-sa="${sA}" data-ta="${tA}">
    <svg viewBox="0 0 200 200" role="img" aria-label="Temperatura ${fmtC(t)} grados${off ? ", apagada" : ", objetivo " + fmtC(sp)}">
      <path class="g-track" d="${full}" fill="none" stroke="var(--soft)" stroke-width="14" stroke-linecap="round"/>
      ${off ? "" : `<path class="g-fill" d="${full}" pathLength="100" stroke-dasharray="100 200" style="stroke-dashoffset:${100 - pct}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>`}
      ${ticks}
      ${off ? "" : `<g class="g-rot set" style="transform:rotate(${sA}deg)"><circle cx="${x0}" cy="${y0}" r="4.5" fill="var(--card)"/></g>`}
      ${t === null ? "" : (() => { const [ia, ib] = [pt(START, R - 11), pt(START, R + 11)]; return `<g class="g-rot temp" style="transform:rotate(${tA}deg)"><line x1="${ia[0]}" y1="${ia[1]}" x2="${ib[0]}" y2="${ib[1]}" stroke="var(--card)" stroke-width="7" stroke-linecap="round"/><line x1="${ia[0]}" y1="${ia[1]}" x2="${ib[0]}" y2="${ib[1]}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g>`; })()}
      <text x="${x0 - 6}" y="${y0 + 22}" class="g-scale">${MIN}°</text>
      <text x="${x1 - 8}" y="${y1 + 22}" class="g-scale">${MAX}°</text>
    </svg>
    <div class="center">
      <div class="g-cap">${isHeating(r) ? icon("flame", "mini heat") + " Calentando" : "Ahora"}</div>
      <div class="g-temp" data-vt-hero style="view-transition-name: room-temp">${fmtC(t)}<small>°</small></div>
      <div class="g-set">${off ? "Apagada" : `Objetivo <b data-tick="set${r.id}">${fmtC(sp)} °C</b>`}</div>
    </div>
  </div>`;
}

function actionRow(items) {

    `<${tag} ${attrs} style="--k:${k}"><span class="ic">${IC[ic] ? icon(ic) : `<img src="/icons/${ic}.svg" alt="">`}</span><span class="lbl">${label}${sub ? `<span class="sub">${sub}</span>` : ""}</span>${icon("chevron", "chev")}</${tag}>`).join("")}</div>`;
}

        </div>
        <div class="sched-main">
          <div class="paintbar">

// on/off service timer screens (timer.json), 48 half-hour slots per day
let stDay = (new Date().getDay() + 6) % 7, stDays = null;
function serviceTimer(d) {
  stDays = Array.from({length: 7}, (_, day) => Array.from({length: 48}, (_, s) => {
    const w = (d.timer || [])[day * 3 + Math.floor(s / 16)]?.value || 0;
    return (w >>> ((s % 16) * 2)) & 3 ? "on" : "off";
  }));
  const hours = Array.from({length: 12}, (_, i) => `<div class="h">${String(i * 2).padStart(2, "0")}</div>`).join("");
  return `<p class="muted small">Pulsa las franjas para alternar encendido/apagado y guarda el día.</p>
    <div class="week" id="sWeek"><div></div>${hours}${stDays.map((slots, day) => `<div class="d" data-day="${day}" style="${day === stDay ? "text-decoration:underline" : ""}">${DAYS[day].slice(0, 3)}</div>` +
      slots.map((m, i) => `<div class="s slot-${m}" data-d="${day}" data-i="${i}"></div>`).join("")).join("")}</div>
    <div class="actions" style="margin-top:12px"><button class="btn primary" id="sSave">Guardar ${DAYS[stDay].toLowerCase()}</button>
      <button class="btn" data-scopy="31">Copiar a lunes-viernes</button><button class="btn" data-scopy="127">Copiar a lunes-domingo</button></div>`;
}
function bindServiceTimer(m, set) {
  $("#sWeek").onclick = ev => {
    const el = ev.target.closest("[data-i]"), dl = ev.target.closest("[data-day]");
    if (dl) { stDay = Number(dl.dataset.day); document.querySelectorAll("#sWeek .d").forEach(x => x.style.textDecoration = x === dl ? "underline" : ""); $("#sSave").textContent = "Guardar " + DAYS[stDay].toLowerCase(); return; }
    if (!el) return;
    const d = Number(el.dataset.d), i = Number(el.dataset.i);
    stDays[d][i] = stDays[d][i] === "on" ? "off" : "on"; el.className = `s slot-${stDays[d][i]}`; stDay = d;
    $("#sSave").textContent = "Guardar " + DAYS[stDay].toLowerCase();
  };
  $("#sSave").onclick = () => set({day: stDay, slots: stDays[stDay]});
  document.querySelectorAll("[data-scopy]").forEach(b => b.onclick = async () => {
    if (!confirm(`¿Copiar el ${DAYS[stDay].toLowerCase()} a los días elegidos?`)) return;
    try { await api("/api/menu/set", {body: {id: m.id, type: "timer copy", day: stDay, mask: Number(b.dataset.scopy)}}); toast("Copiado"); rereadSoon(); } catch (e) { toast(e.message, 6000); }
  });
}

// ---------- friendly names for device registers

function zoneRooms() {
  const out = {};
  for (const [z, t] of Object.entries(S.zones || {})) { const r = S.rooms.find(r => r.type === t); if (r) out[z] = r; }
  return out;
}
/** {group, label, unit} or a history key like "Entradas · 116.1 [°C]" -> human name, or null to hide. */
function metricName(m) {
  if (typeof m === "string") {
    const mm = /^(?:(.*) · )?(.*?)(?: \[(.*)\])?$/.exec(m);
    m = {group: mm[1] || "", label: mm[2], unit: mm[3] || ""};
  }
  const {group, label, unit} = m;
  if (/--$/.test(label)) return null;
  if (label === "Exterior") return "Temperatura exterior";
  if (group === "Entradas") {
    const room = sensorRoom(label);
    if (room) return `${unit.includes("%") ? "Humedad" : "Sensor"} de ${roomTitle(room)}`;
    if (label === "1") return unit.includes("%") ? "Humedad del termostato" : "Termostato °CALEON";
    if (/^\d+\.\d+$/.test(label)) return `Sonda ${label}`;
    if (/^\d+\.N\d+$/.test(label)) return `Entrada PWM ${label}`;
  }
  if (group.startsWith("Bomba circuito")) return {"Ida nominal": "Impulsión objetivo", "Ida": "Impulsión", "Modo": "Bomba del circuito"}[label] || label;
  if (group === "Salidas") {
    const z = /Zona ([A-Z])$/.exec(label);
    if (z) { const r = zoneRooms()[z[1]]; return r ? `${roomTitle(r)} · zona ${z[1]}` : null; }
    if (/Bomba circuito/.test(label)) return "Bomba del circuito";
    if (/Demanda de energía/.test(label)) return "Demanda a la caldera";
  }
  return label;
}

// ---------- charts

function lineChart(svg, legendEl, series, hours, {yUnit = "", lanes = false, bands = []} = {}) {
  const W = svg.clientWidth || 800, H = svg.clientHeight || 260;
  const narrow = W < 520;
  const P = {l: lanes ? (narrow ? 118 : 190) : 38, r: 12, t: 12, b: 24};
  const visible = series.filter(s => !s.hidden);
  const vals = visible.flatMap(s => s.points.map(p => p[1])).filter(v => v !== null && v !== undefined);
  if (!series.length || (!vals.length && !lanes)) {
    svg.innerHTML = ""; svg.style.height = "auto";
    legendEl.innerHTML = `<div class="chart-empty">Aún no hay datos en este periodo. El servidor guarda una muestra cada minuto.</div>`; return;
  }
  const now = Date.now() / 1000;
  const first = Math.min(...visible.flatMap(s => s.points.slice(0, 1).map(p => p[0])), now);
  let t0 = now - hours * 3600;
  const t1 = now;
  if (first > t0 + (now - t0) * 0.2) t0 = Math.max(t0, first - Math.max(900, (now - first) * 0.08), now - Math.max(3 * 3600, (now - first) * 1.1));
  const partial = first > now - hours * 3600 + 900;
  let lo, hi;
  if (lanes) { lo = 0; hi = visible.length || 1; }
  else if (yUnit === "%") { lo = Math.floor(Math.min(...vals) - 0.5); hi = Math.ceil(Math.max(...vals) + 0.5); }
  else { lo = Math.min(...vals); hi = Math.max(...vals); const pad = Math.max(0.4, (hi - lo) * 0.15); lo = Math.floor((lo - pad) * 2) / 2; hi = Math.ceil((hi + pad) * 2) / 2; }
  const x = t => P.l + (t - t0) / Math.max(1, t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  let g = "";
  for (const [b0, b1] of bands) if (b1 > t0) g += `<rect class="hband" x="${x(Math.max(b0, t0))}" y="${P.t}" width="${Math.max(2, x(b1) - x(Math.max(b0, t0)))}" height="${H - P.t - P.b}"/>`;
  if (!lanes) {
    const span = hi - lo, stepY = span <= 3 ? 0.5 : span <= 7 ? 1 : span <= 15 ? 2 : span <= 40 ? 5 : 10;
    for (let v = Math.ceil(lo / stepY) * stepY; v <= hi + 1e-9; v += stepY)
      g += `<line class="gl" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${String(+v.toFixed(1)).replace(".", ",")}${yUnit}</text>`;
  }
  const span = t1 - t0, want = narrow ? 5 : 8;
  const step = [1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800].find(st => span / st <= want) || 604800;
  const tz = -new Date().getTimezoneOffset() * 60;
  for (let t = Math.ceil((t0 + tz) / step) * step - tz; t <= t1; t += step) {
    const d = new Date(t * 1000), xx = x(t);
    if (xx < P.l + 14 || xx > W - P.r - 14) continue;
    const lab = step >= 86400 ? d.toLocaleDateString("es-ES", {day: "numeric", month: "short"}) : d.toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
    g += `<line class="gl" x1="${xx}" x2="${xx}" y1="${H - P.b}" y2="${H - P.b + 4}"/><text x="${xx}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  }
  const gap = Math.max(300, hours * 3600 / 600 * 2.5);
  let lines = "", laneLabels = "";
  if (lanes && !visible.some(s => s.points.some(p => p[1] >= 0.5 && p[0] >= t0))) {
    svg.innerHTML = ""; svg.style.height = "0px"; svg.style.display = "none";
    legendEl.innerHTML = `<div class="chart-empty">${icon("power", "mini")} Ninguna zona ha calentado en este periodo.</div>`; return;
  }
  svg.style.display = "";
  const solid = visible.filter(s => !s.dashed);
  visible.forEach((s, k) => {
    const dy = lanes || s.dashed ? 0 : (solid.indexOf(s) - (solid.length - 1) / 2) * 1.6;
    if (lanes) {
      const lh = (H - P.t - P.b) / visible.length, top = P.t + k * lh, bh = Math.min(16, lh * 0.62);
      let rects = "", start = null;
      s.points.forEach(([ts, v], i) => {
        const next = s.points[i + 1];
        if (v >= 0.5 && start === null) start = ts;
        if (start !== null && (v < 0.5 || !next || next[0] - ts > gap)) { const end = v < 0.5 ? ts : ts + 60; rects += `<rect x="${x(Math.max(start, t0))}" width="${Math.max(2, x(end) - x(Math.max(start, t0)))}" y="${top + (lh - bh) / 2}" height="${bh}" fill="${s.color}" rx="${bh / 2}"/>`; start = null; }
      });
      const maxCh = narrow ? 13 : 22, lab = s.name.length > maxCh ? s.name.slice(0, maxCh - 1) + "…" : s.name;
      lines += `<rect class="lane" x="${P.l}" y="${top + (lh - bh) / 2}" width="${W - P.l - P.r}" height="${bh}" rx="${bh / 2}"/>${rects}`;
      laneLabels += `<text class="lane-label" x="2" y="${top + lh / 2 + 4}"><title>${esc(s.name)}</title>${esc(lab)}</text>`;
      return;
    }
    let d = "", last = null;
    for (const [ts, v] of s.points) {
      if (v === null || v === undefined || ts < t0) { last = null; continue; }
      if (last !== null && ts - last <= gap) d += s.step ? `H${x(ts).toFixed(1)}V${(y(v) + dy).toFixed(1)}` : `L${x(ts).toFixed(1)},${(y(v) + dy).toFixed(1)}`;
      else d += `M${x(ts).toFixed(1)},${(y(v) + dy).toFixed(1)}`;
      last = ts;
    }
    const stroke = s.dashed ? `color-mix(in oklch, ${s.color} 55%, var(--card))` : s.color;
    if (!s.dashed) lines += `<path d="${d}" fill="none" stroke="var(--card)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
    lines += `<path ${s.dashed ? "" : 'class="line" pathLength="1"'} d="${d}" fill="none" stroke="${stroke}" stroke-width="${s.dashed ? 1.6 : 2.2}" ${s.dashed ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cid = "clip" + Math.random().toString(36).slice(2, 8);
  const tags = "";
  svg.innerHTML = `<defs><clipPath id="${cid}"><rect x="${P.l}" y="${P.t - 2}" width="${W - P.l - P.r}" height="${H - P.t - P.b + 4}"/></clipPath></defs>` + g +
    `<g clip-path="url(#${cid})">${lines}</g>` + laneLabels + tags + `<g class="scrub" style="display:none"><line y1="${P.t}" y2="${H - P.b}"/><g class="dots"></g></g>`;
  const fmtV = v => v === null || v === undefined ? "—" : v.toFixed(1).replace(".", ",") + (yUnit === "°" ? " °C" : yUnit === "%" ? " %" : "");
  // scrubber: a readout line above the plot, never covering the lines
  if (!lanes) {
    const wrap = svg.parentElement;
    let tip = wrap.querySelector(".readout");
    if (!tip) { tip = document.createElement("div"); tip.className = "readout"; wrap.insertBefore(tip, svg); }
    const first = !document.querySelector("#view .readout") || wrap.querySelector(".readout") === document.querySelector("#view .readout");
    const idle = first ? `<span class="muted">${matchMedia("(any-pointer: coarse)").matches ? "Toca el gráfico" : "Pasa el ratón por el gráfico"} para ver los valores</span>` : "";
    tip.innerHTML = idle;
    const move = ev => {
      const rect = svg.getBoundingClientRect(), px = (ev.clientX - rect.left) / rect.width * W;
      if (px < P.l || px > W - P.r) return;
      const t = t0 + (px - P.l) / (W - P.l - P.r) * (t1 - t0);
      const rows = visible.filter(s => !s.twinOf).map(s => {
        let best = null; for (const p of s.points) if (p[1] !== null && (best === null || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p;
        return best && Math.abs(best[0] - t) < gap ? {s, v: best[1]} : null;
      }).filter(Boolean);
      const sc = svg.querySelector(".scrub"); sc.style.display = ""; sc.firstElementChild.setAttribute("x1", px); sc.firstElementChild.setAttribute("x2", px);
      sc.querySelector(".dots").innerHTML = rows.filter(({v}) => v >= lo && v <= hi).map(({s, v}) => `<circle class="dotc" cx="${px}" cy="${y(v)}" r="4.5" fill="${s.dashed ? `color-mix(in oklch, ${s.color} 55%, var(--card))` : s.color}"/>`).join("");
      tip.innerHTML = `<b>${new Date(t * 1000).toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"})}</b>` + rows.map(({s, v}) => `<span><i style="background:${s.dashed ? `color-mix(in oklch, ${s.color} 55%, var(--card))` : s.color}"></i>${esc(s.name)} <b>${fmtV(v)}</b></span>`).join("");
    };
    svg.onpointermove = move; svg.onpointerdown = move;
    svg.onpointerleave = () => { svg.querySelector(".scrub").style.display = "none"; tip.innerHTML = idle; };
  }
  const sinceTxt = new Date(first * 1000).toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
  const note = (partial ? `<span class="chart-note">Solo hay datos desde las ${sinceTxt}${first < now - 86400 ? " del " + new Date(first * 1000).toLocaleDateString("es-ES", {day: "numeric", month: "short"}) : ""}</span>` : "")
    ;
  const shown = series.filter(s => !s.noLegend);
  legendEl.innerHTML = (shown.length === 1 ? ""
    : shown.map(s => `<button class="lg ${s.hidden ? "off" : ""}" data-i="${series.indexOf(s)}" aria-pressed="${!s.hidden}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join("")) + note;
  legendEl.onchange = null;
  legendEl.onclick = ev => { const b = ev.target.closest(".lg"); if (!b) return; const s = series[Number(b.dataset.i)]; s.hidden = !s.hidden; (s.twins || []).forEach(t => t.hidden = s.hidden); lineChart(svg, legendEl, series, hours, {yUnit, lanes, bands}); };
}

/** Time ranges in which any of `keys` was on, from /api/metrics. */
function onIntervals(metrics, keys) {
  const pts = keys.flatMap(k => (metrics[k] || []).map(p => [p[0], p[1] >= 0.5])).sort((a, b) => a[0] - b[0]);
  const out = []; let start = null;
  for (const [ts, on] of pts) { if (on && start === null) start = ts; if (!on && start !== null) { out.push([start, ts]); start = null; } }
  if (start !== null) out.push([start, Date.now() / 1000]);
  return out;
}

// 5-sample median: hides 0,1° sensor flicker without moving real changes
// median of 5, then a 0,15° dead band: the sensor's 0,1° flicker never draws as steps
const deblip = (pts, band = 0.15) => {
  const med = pts.map((p, i) => { if (p[1] === null) return p; const w = pts.slice(Math.max(0, i - 2), i + 3).map(q => q[1]).filter(v => v !== null).sort((a, b) => a - b); return [p[0], w[Math.floor(w.length / 2)]]; });
  let last = null;
  return med.map(p => { if (p[1] === null) { last = null; return p; } if (last === null || Math.abs(p[1] - last) >= band) last = p[1]; return [p[0], last]; });
};
async function drawRoomChart(svg, legend, hours, onlyRoom, what = "temp") {
  let data; try { data = await api(`/api/history?hours=${hours}`); } catch (e) { return; }
  const pal = palette(), series = [];
  let bands = [];
  Object.entries(data).forEach(([room, rows]) => {
    if (onlyRoom !== null && room !== onlyRoom) return;
    const r = S.rooms.find(r => String(r.id) === room), name = r ? roomTitle(r) : "Sala " + room, c = pal[Number(room) % pal.length];
    if (what === "hum") { if (rows.some(x => x[2] !== null)) series.push({name, color: c, step: true, points: deblip(rows.map(x => [x[0], x[2]]), 0.6)}); return; }
    const main = {name, color: c, step: true, points: deblip(rows.map(x => [x[0], x[1]]))};
    series.push(main);
    if (r && modeOf(r) !== "off") {
      const tset = {name: onlyRoom === null ? name + " · objetivo" : "Objetivo", color: c, dashed: true, step: true, noLegend: onlyRoom === null, points: rows.map(x => [x[0], x[3]])};
      if (onlyRoom === null) { main.twins = [tset]; tset.twinOf = main; }
      series.push(tset);
    }
  });
  if (onlyRoom !== null && what === "temp") {
    const r = S.rooms.find(r => String(r.id) === onlyRoom);
    const keys = (r?.outputs || []).map(o => `Salidas · ${o.label}`);
    if (keys.length) { try { bands = onIntervals(await api(`/api/metrics?hours=${hours}`), keys); } catch (e) {} }
  }
  lineChart(svg, legend, series, hours, {yUnit: what === "hum" ? "%" : "°", bands});
}

const historySpan = () => S && S.history_since ? Date.now() / 1000 - S.history_since : 0;
function rangeSeg(id, ranges, current) {
  const span = historySpan();
  const ok = (h, i) => i === 0 || span >= h * 3600 * 0.3;
  const labels = {6: "6 h", 24: "24 h", 168: "7 días", 720: "30 días"};
  return `<div class="seg" id="${id}" title="${ranges.some((h, i) => !ok(h, i)) ? "Los rangos largos se activan cuando haya más historial guardado" : ""}">${ranges.map((h, i) => `<button data-h="${h}" class="${h === current ? "active" : ""}" ${ok(h, i) ? "" : `disabled title="Aún no hay ${labels[h]} de datos"`}>${labels[h]}</button>`).join("")}</div>`;
}
const bestRange = (ranges, want) => { const span = historySpan(); return [...ranges].reverse().find((h, i) => h <= want && (h === ranges[0] || span >= h * 3600 * 0.3)) || ranges[0]; };
const PROBES = ["oklch(0.6 0.16 345)", "oklch(0.58 0.1 120)", "oklch(0.55 0.05 260)", "oklch(0.6 0.09 60)", "oklch(0.6 0.08 200)", "oklch(0.55 0.12 290)"];

function viewCharts() {
  let hours = bestRange([6, 24, 168, 720], 24);
  const outCount = () => (S.status || []).filter(m => m.group === "Salidas" && metricName(m)).length;
  $("#view").innerHTML = `
    <div class="page-head"><h3>Gráficas</h3>
      ${rangeSeg("cRange", [6, 24, 168, 720], hours)}</div>
    <div class="card chart-card"><div class="chart-head"><b>Temperatura</b>${S.rooms.some(r => modeOf(r) !== "off") ? `<span class="muted small">Discontinua: objetivo</span>` : ""}</div><div class="chart-wrap"><svg class="chart" id="c1"></svg></div><div class="legend" id="l1"></div></div>
    <div class="card chart-card"><div class="chart-head"><b>Humedad${(() => { const h = S.rooms.filter(r => r.humidity && r.humidity !== "--"); return h.length === 1 ? " · " + esc(roomTitle(h[0])) : ""; })()}</b></div><div class="chart-wrap"><svg class="chart" id="c2" style="height:180px"></svg></div><div class="legend" id="l2"></div></div>
    <div class="card chart-card"><div class="chart-head"><b>Cuándo ha calentado cada habitación</b><span class="muted small">Según las válvulas de cada zona</span></div><div class="chart-wrap"><svg class="chart" id="c4" style="height:${Math.max(120, 34 * outCount() + 36)}px"></svg></div><div class="legend" id="l4"></div></div>
    <div class="card chart-card"><div class="chart-head"><b>Otros valores del equipo</b></div><div class="chart-wrap"><svg class="chart" id="c3"></svg></div><div class="legend" id="l3"></div></div>`;
  const draw = async () => {

    const outputs = keys.filter(k => k.startsWith("Salidas") && metricName(k)).sort((a, b) => metricName(a).localeCompare(metricName(b), "es"));
    lineChart($("#c4"), $("#l4"), outputs.map((k, i) => ({name: metricName(k), color: /Bomba|caldera/.test(metricName(k)) ? "var(--cool)" : "var(--accent)", points: m[k], noLegend: true})), hours, {lanes: true});
    const c4 = $("#c4"); if (c4 && c4.style.display === "none") c4.closest(".chart-card").classList.add("collapsed");
    const varies = k => { const v = (m[k] || []).map(p => p[1]).filter(x => x !== null); return v.length > 1 && Math.max(...v) - Math.min(...v) > 0.05; };
    const shownAnalog = analog.filter(varies);
    $("#c3").closest(".chart-card").hidden = !shownAnalog.length;
    analog.length = 0; analog.push(...shownAnalog);
    lineChart($("#c3"), $("#l3"), analog.map((k, i) => ({name: metricName(k), color: PROBES[i % PROBES.length], points: m[k], hidden: false})), hours, {yUnit: "°"});
  };
  $("#cRange").onclick = ev => { const b = ev.target.closest("button"); if (!b || b.disabled) return; hours = Number(b.dataset.h); [...$("#cRange").children].forEach(x => x.classList.toggle("active", x === b)); draw(); };
  draw();
  every(draw, 60000);
}

// ---------- backups

const dayLabel = ts => {
  const d = new Date(ts * 1000), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / 864e5);
  return diff === 0 ? "Hoy" : diff === -1 ? "Ayer" : d.toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "long"});
};
const clock = ts => new Date(ts * 1000).toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});

function viewBackups() {
  let list = null, open = null, busy = null, result = {};
  const render = () => {
    const last = list && list[0];
    $("#view").innerHTML = banner() + `
      <a class="back" href="#/settings">${icon("back", "mini")} Ajustes</a>
      <div class="page-head"><h3>Copias de seguridad</h3>
        <button class="btn primary" id="bNew" ${busy || S.crawling ? "disabled" : ""}>${busy === "new" ? '<span class="spin"></span> Copiando…' : "Hacer copia ahora"}</button></div>
      <p class="lead">${!list ? "Cargando…" : (last ? `Última copia: ${dayLabel(last.created).toLowerCase()} a las ${clock(last.created)}. ` : "Todavía no hay copias. Hacer una tarda alrededor de un minuto. ") + (S.backup_hours ? `Cada ${S.backup_hours === 24 ? "día" : S.backup_hours + " horas"} el servidor revisa la configuración y guarda una copia solo si algo ha cambiado.` : "Las copias automáticas están desactivadas en este servidor.")}</p>
      <div class="bk-list stagger">${(list || []).map((b, k) => `<div class="bk ${open === b.name ? "open" : ""}" style="--k:${k}">
        <button class="bk-row" data-open="${esc(b.name)}" aria-expanded="${open === b.name}">
          <span class="bk-ic">${icon("archive")}</span>
          <span class="bk-main"><b>${esc(dayLabel(b.created))}, ${clock(b.created)}</b><span class="muted small">${b.reason === "manual" ? "Manual" : "Automática"} · ${Math.round(b.size / 1024)} KB</span></span>
          ${icon("chevron", "chev")}</button>
        ${open === b.name ? `<div class="bk-actions">
          <a class="btn" href="/api/backups/${encodeURIComponent(b.name)}">Descargar</a>
          <button class="btn" data-cmp="${esc(b.name)}" ${busy ? "disabled" : ""}>Comparar</button>
          <button class="btn" data-rst="${esc(b.name)}" ${busy ? "disabled" : ""}>Restaurar…</button>
          </div>
          <div class="bk-danger"><button class="btn ghost warn" data-del="${esc(b.name)}" ${busy ? "disabled" : ""}>Borrar esta copia</button></div>
          ${busy === b.name ? `<div class="bk-progress"><span id="bkStep">Leyendo la configuración del equipo para compararla…</span><div class="bar determinate"><i id="bkBar"></i></div></div>` : ""}
          ${result[b.name] || ""}` : ""}
      </div>`).join("")}</div>
      <div class="bk-upload"><label class="btn">Comparar un archivo de copia…<input type="file" id="bUpload" accept=".json,application/json" hidden></label>${result.upload || ""}</div>
      <p class="muted small" style="margin-top:18px">Restaurar devuelve los nombres de las habitaciones y sus horarios. Los ajustes del menú Experto solo se comparan: el equipo no deja escribirlos de golpe, se cambian uno a uno desde Experto.</p>`;
    const $$ = sel => document.querySelectorAll(sel);
    $("#bNew").onclick = async () => {
      busy = "new"; render();
      try { const r = await api("/api/backups", {body: {}}); toast("Copia hecha"); open = r.name; } catch (e) { toast("No se pudo copiar: " + e.message, 6000); }
      busy = null; load();
    };
    $$("[data-open]").forEach(b => b.onclick = () => { open = open === b.dataset.open ? null : b.dataset.open; render(); });
    $$("[data-cmp]").forEach(b => b.onclick = () => compare(b.dataset.cmp, false));
    $$("[data-rst]").forEach(b => b.onclick = () => compare(b.dataset.rst, true));
    $$("[data-del]").forEach(b => b.onclick = async () => {
      if (!await ask({title: "¿Borrar esta copia?", text: "No se puede deshacer.", input: false, ok: "Borrar"})) return;
      try { await api(`/api/backups/${encodeURIComponent(b.dataset.del)}`, {method: "DELETE"}); open = null; load(); } catch (e) { toast(e.message); }
    });
    $("#bUpload").onchange = async ev => {
      const f = ev.target.files[0]; if (!f) return;
      try { const backup = JSON.parse(await f.text()); await compare("upload.json", false, backup); } catch (e) { toast("Ese archivo no es una copia válida", 6000); }
    };
  };
  const diffHtml = (r, title) => {
    const n = r.changes.length + r.menu_differences.length;
    const ch = r.changes.map(c => `<li><b>${esc(c.what)}</b>${c.note ? `<span class="muted"> · ${esc(c.note)}</span>` : Array.isArray(c.to) ? `<div class="mini-tl">${miniTimer(c.from)}${miniTimer(c.to)}</div>` : `<div class="muted">${esc(c.from)} → <b>${esc(c.to)}</b></div>`}</li>`).join("");
    const named = p => String(p).replace(/Habitación \d+/g, n => { const rr = S.rooms.find(x => x.name === n); return rr ? roomTitle(rr) : n; });
    const md = r.menu_differences.map(c => `<li><b>${esc(named(c.path))}</b><div class="muted">ahora ${esc(es(c.current))} · en la copia <b>${esc(es(c.backup))}</b></div></li>`).join("");
    return `<div class="bk-result ${n ? "" : "ok"}"><div class="bk-res-title">${n ? `${n} diferencia${n > 1 ? "s" : ""} con el equipo` : `${icon("check", "mini")} Sin cambios de configuración: todo coincide con el equipo`}</div>
      ${r.applied ? `<div class="muted small">${title}</div>` : ""}${ch || md ? `<ul class="diff">${ch}${md}</ul>` : ""}</div>`;
  };
  const compare = async (name, apply, backup) => {
    busy = name; open = name === "upload.json" ? open : name; render();
    // live progress from the server's crawl counter
    const tick = setInterval(async () => {

        if (bar && exp) bar.style.width = Math.min(98, done / exp * 100) + "%";
      } catch (e) {}
    }, 1500);
    timers.push(tick);
    try {
      const body = {apply: false, ...(backup ? {backup} : {})};
      const r = await api(`/api/backups/${encodeURIComponent(name)}/restore`, {body});
      const key = name === "upload.json" ? "upload" : name;
      result[key] = diffHtml(r);
      if (apply) {
        busy = null; render();
        if (!r.changes.length) { toast("No hay nombres ni horarios que restaurar"); return; }
        if (!await ask({title: "¿Restaurar esta copia?", text: `Se escribirán ${r.changes.length} cambios de nombres y horarios en el termostato.`, input: false, ok: "Restaurar"})) return;
        busy = name; render();
        result[key] = diffHtml(await api(`/api/backups/${encodeURIComponent(name)}/restore`, {body: {...body, apply: true}}), "Restaurado"); rereadSoon();
        toast("Copia restaurada");
      }
    } catch (e) {
      const lost = /sin respuesta|no respond/i.test(e.message);
      result[name] = `<div class="bk-result err"><div class="bk-res-title">${lost ? "El termostato dejó de responder mientras lo leíamos" : "No se pudo comparar"}</div>
        <div class="muted small">${lost ? "Suele pasar si alguien usa el termostato o la app a la vez. Prueba de nuevo en un momento." : esc(shortErr(e.message))}</div>
        <button class="btn" style="margin-top:10px" data-cmp="${esc(name)}">Reintentar</button></div>`;
    }
    clearInterval(tick);
    busy = null; await loadState(); render();
  };
  const load = async () => { await loadState(); try { list = await api("/api/backups"); } catch (e) { toast(e.message); list = []; } render(); };
  render(); load();
}

function miniTimer(slots) {
  if (!slots) return "";
  return `<span class="mt">${segments(slots).map(g => `<i class="slot-${g.mode}" style="flex:${g.end - g.start}"></i>`).join("")}</span>`;
}

const LOG_TEXT = [
  [/^Reinicio$/i, "El equipo se reinició"],
  [/CAN_Bus está conectado/i, "Conectado con la centralita"],
  [/CAN_Bus.*(desconectado|perdido|error)/i, "Se perdió la conexión con la centralita"],

function friendlyLog(msg) { for (const [re, t] of LOG_TEXT) if (re.test(msg)) return t; return msg; }

async function viewInfo() {
  let log = [];

  // "2026-08-08 - 13:13 (116)" -> date, time; merge the same event logged within the same minute

  for (const l of log) {
    const m = /^(\d{4}-\d{2}-\d{2}) - (\d{2}:\d{2})/.exec(l.dt || "");
    const date = m ? m[1] : "", time = m ? m[2] : l.dt, text = friendlyLog(l.msg);
    const prev = items[items.length - 1];
    if (prev && prev.date === date && prev.text === text && Math.abs(Number(prev.time.replace(":", "")) - Number(time.replace(":", ""))) <= 1) continue;
    items.push({date, time, text, raw: l.msg});
  }
  const days = [];
  for (const it of items) { const d = days[days.length - 1]; if (d && d.date === it.date) d.items.push(it); else days.push({date: it.date, items: [it]}); }
  const fmtDate = d => d ? new Date(d + "T12:00").toLocaleDateString("es-ES", {weekday: "short", day: "numeric", month: "long", year: "numeric"}) : "";
  const zones = Object.entries(zoneRooms()).map(([z, r]) => `zona ${esc(z)}: ${esc(roomTitle(r))}`).join(" · ");
  const reboots = items.filter(i => /reinició/.test(i.text)).length;
  $("#view").innerHTML = `
    <a class="back" href="#/settings">${icon("back", "mini")} Ajustes</a>
    <div class="page-head"><h3>Avisos</h3></div>
    <p class="lead">${items.length ? `${reboots ? `Desde ${fmtDate(items[items.length - 1].date)} el equipo se ha reiniciado ${reboots} ${reboots === 1 ? "vez" : "veces"}, normalmente por cortes de luz, y siempre ha vuelto a conectar con la centralita. ` : ""}Último aviso: ${fmtDate(items[0].date)}.` : "El equipo no tiene avisos."}</p>
    <div class="timeline">${days.map(d => `<div class="tl-day"><div class="tl-date">${esc(fmtDate(d.date))}</div>
      ${d.items.map(i => `<div class="tl-item"><span class="tl-time">${esc(i.time)}</span><span class="tl-dot ${/reinició|perdió/.test(i.text) ? "warn" : ""}"></span><span title="${esc(i.raw)}">${esc(i.text)}</span></div>`).join("")}</div>`).join("")}</div>
    <h2 class="group-title">Equipo</h2>
    <div class="card">
      <div class="kv"><span>Termostato</span><b>${esc(S.device.split(".")[0])}</b></div>
      <div class="kv"><span>Firmware</span><b>${esc(fmtFirmware(S.firmware))}</b></div>
      ${zones ? `<div class="kv"><span>Zonas</span><b>${zones}</b></div>` : ""}
      <details class="adv" style="margin-top:10px"><summary>Detalles técnicos</summary>
        <div class="small muted" style="margin-top:10px">Nabto ${esc(S.nabto || "—")} · funciones: ${Object.entries(S.features || {}).filter(([, v]) => v).map(([k]) => esc(k)).join(", ")}</div></details>
    </div>`;
}

// ---------- settings

const TRANSPORTS = {
  udp: ["Directo", "Habla con el termostato por tu red, sin contraseñas. Es el modo recomendado."],
  session: ["Con correo autorizado", "Igual que el directo, pero el termostato comprueba que tu correo esté autorizado. Útil si algún día el modo directo deja de funcionar."],
  sdk: ["Librería oficial de Nabto", "La misma que usa la app de Sorel. No está incluida en esta instalación."],
};

async function viewSettings() {
  let cfg;
  try { cfg = await api("/api/settings"); } catch (e) { $("#view").innerHTML = `<div class="banner">No pude leer los ajustes: ${esc(e.message)}</div>`; return; }
  let busy = false, advOpen = false;
  const render = () => {
    const theme = applyTheme();
    const ip = cfg.addr.split(":")[0];
    $("#view").innerHTML = `
      <div class="page-head"><h3>Ajustes</h3></div>
      <div class="card conn">
        <span class="live ${S && S.error ? "err" : ""}"></span>
        <div><b>${S && S.error ? "El termostato no responde" : "Conectado al termostato"}</b>
          <div class="muted small">${esc(ip)} · ${esc(TRANSPORTS[cfg.active]?.[0] || cfg.active)} · firmware del ${esc(fmtFirmware(S?.firmware))}</div></div>
      </div>
      ${actionRow([
        ["a", `href="#/backups"`, "archive", "Copias de seguridad", "Guardar y restaurar la configuración"],
        ["a", `href="#/info"`, "bell", "Avisos", "Lo que ha pasado en el equipo"],
      ])}
      <h2 class="group-title">Apariencia</h2>
      <div class="card"><div class="spread"><div><b>Tema</b><div class="muted small">«Sistema» sigue el modo claro u oscuro del móvil</div></div>
        <div class="seg" id="themeSeg">${[["system", "Sistema"], ["light", "Claro"], ["dark", "Oscuro"]].map(([k, l]) => `<button data-theme-set="${k}" class="${k === theme ? "active" : ""}">${l}</button>`).join("")}</div></div></div>
      <details class="card section adv" id="adv" ${advOpen ? "open" : ""}><summary>Avanzado: cómo conectar con el termostato</summary>
        <div class="radio-list">${Object.entries(TRANSPORTS).map(([k, [title, text]]) => {
          const ok = cfg.available.includes(k);
          return `<label class="radio ${ok ? "" : "disabled"}"><input type="radio" name="transport" value="${k}" ${k === cfg.transport ? "checked" : ""} ${ok ? "" : "disabled"}>
            <span><b>${esc(title)}</b>${ok ? "" : ' <span class="muted small">no disponible aquí</span>'}<br><span class="muted small">${esc(text)}</span></span></label>`;
        }).join("")}</div>
        <label class="field"><span>IP del termostato</span><input id="sHost" inputmode="decimal" value="${esc(cfg.host)}" placeholder="Buscar automáticamente"></label>
        <label class="field" id="emailRow"><span>Correo autorizado</span><input id="sEmail" type="email" value="${esc(cfg.email || "")}" placeholder="tu-correo@ejemplo.com">
          <small class="muted">Tiene que estar en Experto › Ajustes › WiFi › Control de acceso.</small></label>
        <div class="actions" style="margin-top:14px"><button class="btn primary" id="sSave" ${busy ? "disabled" : ""}>${busy ? '<span class="spin"></span> Probando…' : "Probar y guardar"}</button></div>
        <p class="muted small">Si el termostato no responde con el modo nuevo, se queda el que tenías.</p>
      </details>`;
    $("#adv").ontoggle = e => { advOpen = e.target.open; };
    document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => { applyTheme(b.dataset.themeSet); render(); });
    const syncEmail = () => { $("#emailRow").style.display = document.querySelector('input[name="transport"]:checked')?.value === "session" ? "" : "none"; };
    document.querySelectorAll('input[name="transport"]').forEach(r => r.onchange = syncEmail);
    syncEmail();
    $("#sSave").onclick = async () => {
      const transport = document.querySelector('input[name="transport"]:checked')?.value;
      busy = true; render();
      try { cfg = await api("/api/settings", {body: {transport, host: $("#sHost").value.trim(), email: $("#sEmail").value.trim()}}); toast("Conectado en modo " + TRANSPORTS[cfg.active][0].toLowerCase()); }
      catch (e) { toast("No se aplicó: " + e.message, 7000); }
      busy = false; render();
    };
  };
  render();
}

loadState().then(route);
</script>
</body>
</html>
