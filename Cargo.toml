[workspace]
members = ["crates/caleon", "crates/caleon-server"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
authors = ["Daniel Biedma <info@dbr.io>"]
repository = "https://github.com/danibram/caleon"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
ts-rs = "10"

[profile.release]
strip = true
lto = "thin"
